<!DOCTYPE html>
<html>

<head>
    <title>sum</title>
    <script>
        function addnumber() {
            let fristnumber = Number(document.getElementById("fristnumber").value);
            let secondnumber = Number(document.getElementById("secondnumber").value);
            let answer = fristnumber + secondnumber;
            alert(answer)
        }

    </script>
</head>

<body>
    <label>frist number</label>
    <input id="fristnumber"><br>
    <label>second number</label>
    <input id="secondnumber"><br>
    <button onclick="addnumber()">add</button>


    
</body>

</html>
